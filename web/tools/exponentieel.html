<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exponentieel verband - Wiskunde Hulp</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
  <header class="header">
    <h1>Wiskunde Hulp</h1>
    <span class="logo">📐</span>
  </header>

  <main class="tool-container">
    <a class="terug-link" href="../index.html">&larr; Terug naar overzicht</a>
    <h2>Exponentieel verband</h2>
    <p class="uitleg">
      Bij een exponentieel verband hoort een vaste groeifactor: y = b &middot; g<sup>x</sup>,
      waarbij b de beginwaarde is en g de groeifactor. Vul de beginwaarde,
      groeifactor en het aantal stappen in om de groei per stap te zien.
    </p>

    <div class="visueel">
      <p class="formule">y = b &middot; g<sup>x</sup></p>
    </div>

    <div class="rekentool">
      <label for="beginwaarde">Beginwaarde (b)</label>
      <input type="number" id="beginwaarde" step="any" placeholder="bijv. 100">

      <label for="groeifactor">Groeifactor (g)</label>
      <input type="number" id="groeifactor" step="any" placeholder="bijv. 1.05">

      <label for="stappen">Aantal stappen (0-20)</label>
      <input type="number" id="stappen" step="1" min="0" max="20" placeholder="bijv. 10">

      <button id="bereken-knop" type="button">Bereken</button>
    </div>

    <p id="uitkomst" class="uitkomst"></p>
  </main>

  <script type="py" src="exponentieel.py"></script>
</body>
</html>
